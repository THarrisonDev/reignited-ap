name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  submodules:
    name: submodule integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Submodules initialized and clean
        run: |
          git submodule status --recursive | tee /tmp/sub.txt
          if grep -qE '^[-+U]' /tmp/sub.txt; then
            echo "ERROR: submodule pointers are not in sync (see status above: '-' uninitialized, '+' checked-out sha differs, 'U' merge conflicts)" >&2
            exit 1
          fi
      - name: LICENSE present in every repo
        run: |
          for d in . world client poptracker-pack; do
            test -f "$d/LICENSE" || { echo "ERROR: missing LICENSE in $d" >&2; exit 1; }
          done
          echo "LICENSEs OK"

  quality:
    name: lint + dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # golangci-lint is pinned: its v2 CLI dropped the `-C` flag the
      # submodule Makefiles used to need, and a surprise major bump would
      # turn this job red for reasons unrelated to a change.
      - name: Install lint tools
        run: |
          pip install ruff vulture
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq luarocks
          sudo luarocks install luacheck
          npm install -g jscpd
      - run: make quality

  world:
    name: world (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: make check-version lint package

  client:
    name: client (Go + Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - name: Go tests (checkd, launcher)
        working-directory: client
        run: |
          make -C checkd test
          make -C launcher test
      - name: Lua tests + generated-file audit
        working-directory: client
        run: make lua-tests audit

  spyrosim:
    name: spyrosim (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spyrosim
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./...

  poptracker:
    name: poptracker (generated files)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poptracker-pack
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make check
